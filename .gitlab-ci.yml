test_vectorization_orca:
  stage: test
  extends: .common
  <<: *cache-only-pull
  variables:
    DATABASE_CONFIG_EXTRA_OPTIONS: ""
  script: |
    trap 'test -e /tmp/.debugging && tmux new-session -d -s debug && tmux wait-for done' EXIT

    env
    set -euxo pipefail

    export ENV=devel

    # Install dependencies needed by Apache Arrow reconfiguration
    make build-depends

    # Clean previous coverage-instrumented objects, then rebuild without coverage
    make clean-database
    make build-database

    export MAKE_TEST_COMMAND="-c vector.enable_vectorization=on -c optimizer=on -c enable_parallel=off"
    export TEST_TYPE=installcheck
    make test-vectorization
    export TEST_TYPE=icw_test
    make test-vectorization

    export TEST_TYPE=icw_aocs
    make test-vectorization
  rules:
